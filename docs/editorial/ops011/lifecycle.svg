<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title"><title id="title">Cycle de vie d'une OPS ContinuityOps</title><rect width="1200" height="350" fill="#101827"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="52" font-size="32" font-weight="bold" fill="white">Du mandat au checkpoint</text><g fill="#273b5c" stroke="#718aff" stroke-width="2"><rect x="28" y="110" width="200" height="125" rx="14"/><rect x="264" y="110" width="200" height="125" rx="14"/><rect x="500" y="110" width="200" height="125" rx="14"/><rect x="736" y="110" width="200" height="125" rx="14"/><rect x="972" y="110" width="200" height="125" rx="14"/></g><g font-size="22" font-weight="bold" fill="white"><text x="128" y="162">Qualifier</text><text x="364" y="162">Déléguer</text><text x="600" y="162">Agir</text><text x="836" y="162">Vérifier</text><text x="1072" y="162">Checkpoint</text></g><g font-size="16" fill="#c5d5ee"><text x="128" y="193">Faits / hypothèses</text><text x="364" y="193">Mandat / branche</text><text x="600" y="193">Code / rapport</text><text x="836" y="193">SHA / CI / effets</text><text x="1072" y="193">État / suite</text></g><g font-size="38" fill="#77c8ee"><text x="246" y="183">→</text><text x="482" y="183">→</text><text x="718" y="183">→</text><text x="954" y="183">→</text></g><text x="600" y="298" font-size="20" fill="#9cd7c9">À la reprise : revalider les états volatils, réutiliser les preuves inchangées.</text></g></svg>