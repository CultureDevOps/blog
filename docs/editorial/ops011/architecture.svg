<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">ContinuityOps — HUB, satellites et preuves</title><desc id="desc">Le HUB qualifie et délègue; trois satellites travaillent dans des branches séparées et consignent les preuves dans GitLab.</desc><rect width="1200" height="580" fill="#101827"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="440" y="35" width="320" height="105" rx="18" fill="#4759c9"/><text x="600" y="78" font-size="28" fill="white" font-weight="bold">HUB</text><text x="600" y="108" font-size="17" fill="white">Qualifier · Arbitrer · Déléguer</text><g stroke="#92a7ff" stroke-width="4" fill="none"><path d="M600 140 V190 H200 V230"/><path d="M600 140 V230"/><path d="M600 190 H1000 V230"/></g><g fill="#22354e" stroke="#6ba3ff" stroke-width="2"><rect x="40" y="230" width="320" height="110" rx="14"/><rect x="440" y="230" width="320" height="110" rx="14"/><rect x="840" y="230" width="320" height="110" rx="14"/></g><g fill="white" font-size="24"><text x="200" y="274">Satellite OPS-101</text><text x="600" y="274">Satellite OPS-102</text><text x="1000" y="274">Satellite OPS-103</text></g><g fill="#c5d5ee" font-size="17"><text x="200" y="308">Branche CI dédiée</text><text x="600" y="308">Étude stockage</text><text x="1000" y="308">Préparation service</text></g><g stroke="#7bd6b2" stroke-width="4" fill="none"><path d="M200 340 V405 H600"/><path d="M600 340 V405"/><path d="M1000 340 V405 H600"/><path d="M600 405 V438"/></g><rect x="260" y="438" width="680" height="102" rx="16" fill="#136b62"/><text x="600" y="478" fill="white" font-size="27" font-weight="bold">GitLab — source de vérité</text><text x="600" y="510" fill="white" font-size="19">Issues · Décisions · SHA · MR · CI · Checkpoints</text></g></svg>